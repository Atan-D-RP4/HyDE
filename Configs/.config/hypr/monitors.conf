# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2
monitorv2 {
    output = eDP-1
    position = 0x0
    mode = preferred
    scale = auto
    transform = 0
}

exec = hyprctl -r -- keyword device[$(hyprctl devices -j | jq -r '.touch[] | .name')]:transform $(hyprctl monitors -j | jq -r '.[] | .transform')
exec = hyprctl -r -- keyword device[$(hyprctl devices -j | jq -r '.tablets[] | .name')]:transform $(hyprctl monitors -j | jq -r '.[] | .transform')
