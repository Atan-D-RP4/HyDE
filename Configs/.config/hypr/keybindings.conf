# see https://wiki.hyprland.org/configuring/keywords/ for more
# example binds, see https://wiki.hyprland.org/configuring/binds/ for more

# Grouping of binds for easier management
#  $d=[Group Name|Subgroup Name1|Subgroup Name2|...]
# '$d' is a variable that is used to group binds together (or use another variable)
# This is only for organization purposes and is not a defined hyprland variable
# What we did here is to modify the Description of the binds to include the group name
# The $d will be parsed as a separate key to be use for a GUI or something pretty
# [Main|Subgroup1|Subgroup2|...]
# Main - The main groupname
# Subgroup1.. - The subgroup names can be use to avoid repeating the same description


#*  Variables 
# Default if commented out
# $mainMod = Super # super / meta / windows key
# Assign apps
$TERMINAL = uwsm app -- kitty --single-instance
$EDITOR = $TERMINAL nvim
$EXPLORER = uwsm app -- thunar
$BROWSER = uwsm app -- zen-browser

$wm=Window Management
$d=[$wm]
bindd = $mainMod, Delete, $d kill hyprland session, exec, hyde-shell logout
bindd = $mainMod, Q, $d close focused window, exec, hyde-shell dontkillsteam.sh
bindd = $mainMod, W, $d Toggle floating,  exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 95% 95%; dispatch centerwindow"
bindd = $mainMod, G, $d toggle group, togglegroup
bindd = $mainMod Ctrl, G, $d toggle lock on active group, lockactivegroup, toggle
bindd = $mainMod, F, $d toggle fullscreen, fullscreen
bindd = $mainMod, L, $d lock screen, exec, hyde-shell lockscreen.sh
bindd = $mainMod Shift, F, $d toggle pin on focused window, exec, hyde-shell windowpin.sh
bindd = Control Alt, Delete, $d logout menu, exec, hyde-shell logoutlaunch.sh
bindd = Alt_R, Control_R, $d toggle waybar and reload config, exec, hyde-shell waybar.py --hide
bindd = $mainMod Control, R, reload hyprland config, exec, hyprctl reload config-only

bindd = $mainMod, M, $d minimize window, exec, niflveil.sh minimize
bindd = $mainMod, R, $d restore last minimized window, exec, niflveil.sh restore

$d=[$wm|Group Navigation]
bindd = $mainMod Control, H, $d change active group backwards, changegroupactive, b
bindd = $mainMod Control, L, $d change active group forwards, changegroupactive, f

$d=[$wm|Change focus]
bindd = $mainMod, Left, $d focus left, movefocus, l
bindd = $mainMod, Right, $d focus right, movefocus, r
bindd = $mainMod, Up, $d focus up, movefocus, u
bindd = $mainMod, Down, $d focus down, movefocus, d

bindd = Alt, Tab, $d Cycle focus, cyclenext
bindd = Alt, Tab, $d Cycle focus, bringactivetotop

$d=[$wm|Move Active Window]
bindd = $mainMod Shift, h, $d Left, movewindow, l
bindd = $mainMod Shift, l, $d Right, movewindow, r
bindd = $mainMod Shift, k, $d Up, movewindow, u
bindd = $mainMod Shift, j, $d Down, movewindow, d

$d=[$wm|Resize Active Window]
# Resize windows
bindde = $mainMod Shift, Right, $d resize window right, resizeactive, 30 0
bindde = $mainMod Shift, Left, $d resize window left, resizeactive, -30 0
bindde = $mainMod Shift, Up, $d resize window up, resizeactive, 0 -30
bindde = $mainMod Shift, Down, $d resize  window down, resizeactive, 0 30

# Move active window around current workspace with mainMod + Shift + Control [←→↑↓]
$d=[$wm|Move active window across workspace]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = $mainMod Shift Ctrl, left, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Ctrl, right, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Ctrl, up, Move active window up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Ctrl, down, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move/Resize focused window
$d=[$wm|Move & Resize with mouse]
binddm = $mainMod, mouse:272, $d hold to move window, movewindow
binddm = $mainMod, mouse:273, $d hold to resize window, resizewindow
binddm = $mainMod, Z, $d hold to move window, movewindow
binddm = $mainMod, X, $d hold to resize window, resizewindow

# Toggle focused window split
$d=[$wm]
bindd = $mainMod, J, $d toggle split, togglesplit

$l=Launcher
$d=[$l|Apps]
bindd = $mainMod, T, $d terminal emulator, exec, $TERMINAL
bindd = $mainMod Alt, T, $d toggle dropdown terminal, exec, hyde-shell toggle_dropterm.sh "$TERMINAL"
bindd = $mainMod, E, $d file explorer, exec, $EXPLORER
bindd = $mainMod, C, $d text editor, exec, $EDITOR
bindd = $mainMod, B, $d web browser, exec, $BROWSER
bindd = $mainMod, N, $d toggle notifications panel, exec, swaync-client --toggle-panel # Toggle notifications panel
bindd = Ctrl Shift, Escape, $d system monitor, exec, hyde-shell sysmonlaunch.sh

$d=[$l|Rofi menus]
$rofi_launch=hyde-shell rofilaunch.sh
bindd = $mainMod, A, $d application finder, exec, pkill -x rofi || $rofi_launch d
bindd = $mainMod, TAB, $d window switcher, exec, pkill -x rofi || $rofi_launch w
bindd = $mainMod Shift, E, $d file finder, exec, pkill -x rofi || $rofi_launch f
bindd = $mainMod Shift, C, $d run terminal cmd, exec, pkill -x rofi || $rofi_launch r
bindd = $mainMod, slash, $d keybindings hint, exec, pkill -x rofi || hyde-shell keybinds_hint.sh c # launch keybinds hint
bindd = $mainMod, comma, $d emoji  picker, exec, pkill -x rofi || hyde-shell emoji-picker.sh # launch emoji picker
bindd = $mainMod, period, $d glyph picker, exec, pkill -x rofi || hyde-shell glyph-picker.sh # launch glyph picker
bindd = $mainMod, V, $d clipboard,  exec, pkill -x rofi || hyde-shell cliphist.sh -c # launch clipboard,
bindd = $mainMod Shift, V, $d clipboard manager, exec, pkill -x rofi || hyde-shell cliphist.sh # launch clipboard Manager
bindd = $mainMod Shift, A, $d select rofi launcher, exec, pkill -x rofi || hyde-shell rofiselect.sh # launch select menu


$hc=Hardware Controls
$d=[$hc|Audio]
binddl  =, F10, $d toggle mute output, exec, hyde-shell volumecontrol.sh -o m # toggle audio mute
binddl  =, XF86AudioMute,$d  toggle mute output, exec, hyde-shell volumecontrol.sh -o m # toggle audio mute
binddel =, F11, $d decrease volume, exec, hyde-shell volumecontrol.sh -o d # decrease volume
binddel =, F12, $d increase volume, exec, hyde-shell volumecontrol.sh -o i # increase volume
binddl  =, XF86AudioMicMute,$d un/mute microphone, exec, hyde-shell volumecontrol.sh -i m # toggle microphone mute
binddel =, XF86AudioLowerVolume, $d decrease volume, exec, hyde-shell volumecontrol.sh -o d # decrease volume
binddel =, XF86AudioRaiseVolume, $d increase volume, exec, hyde-shell volumecontrol.sh -o i # increase volume

$d=[$hc|Media]
binddl  =, XF86AudioPlay,$d play media, exec, playerctl play-pause # toggle between media play and pause
binddl  =, XF86AudioPause,$d pause media, exec, playerctl play-pause # toggle between media play and pause
binddl  =, XF86AudioNext,$d next media, exec, playerctl next # media next
binddl  =, XF86AudioPrev,$d  previous media, exec, playerctl previous # media previous

$d=[$hc|Brightness]
binddel =, XF86MonBrightnessUp, $d increase brightness, exec, hyde-shell brightnesscontrol.sh i # increase brightness
binddel =, XF86MonBrightnessDown, $d decrease brightness, exec, hyde-shell brightnesscontrol.sh d # decrease brightness

$d=[$wm|Zoom]
bindde = $mainMod, equal, $d zoom in, exec,  sh -c "hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')"
bindde = $mainMod, minus, $d zoom out, exec, sh -c "hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')"
bindde = $mainMod Shift, Z, $d pinch zoom toggle, exec, uwsm app -- zoom.lua

$d=[$wm|Window Effects]
bindd = $mainMod Ctrl, B, $d toggle blur on focused window, exec, hyprctl dispatch setprop address:$(hyprctl activewindow -j | jq -r .address) noblur toggle

$ut=Utilities
$d=[$ut]
binddl = $mainMod, K, $d toggle keyboard layout, exec, hyde-shell keyboardswitch.sh # switch keyboard layout
bindd = $mainMod Alt, G, $d game mode, exec, hyde-shell gamemode.sh # disable hypr effects for gamemode
bindd = $mainMod Shift, G, $d open game launcher, exec, hyde-shell gamelauncher.sh # run game launcher for steam and lutris

$d=[$ut|Screen Capture]
bindd = $mainMod Shift, P, $d color picker, exec, hyprpicker -an # Pick color (Hex) >> clipboard#
bindd = $mainMod, P, $d snip screen, exec, hyde-shell screenshot.sh s # partial screenshot capture
bindd = $mainMod Ctrl, P, $d freeze and snip screen, exec, hyde-shell screenshot.sh sf # partial screenshot capture (frozen screen)
binddl = $mainMod Alt, P, $d print monitor, exec, hyde-shell screenshot.sh m # monitor screenshot capture
binddl =, Print, $d print all monitors, exec, hyde-shell screenshot.sh p # all monitors screenshot capture
binddl = $mainMod Alt, R, $d record monitor, exec, hyde-shell screenrecord.sh --audio --toggle # monitor recording capture


# TODO Make a main rofi menu for these selectors
$rice=Theming and Wallpaper
$d=[$rice]
bindd = $mainMod Alt, Right, $d next global wallpaper, exec, hyde-shell wallpaper.sh -Gn # next global wallpaper
bindd = $mainMod Alt, Left, $d previous global wallpaper, exec, hyde-shell wallpaper.sh -Gp # previous global wallpaper
bindd = $mainMod Shift, W, $d select a global wallpaper, exec, pkill -x rofi || hyde-shell wallpaper.sh -SG # launch wallpaper select menu
bindd = $mainMod Alt, Up, $d next waybar layout, exec, hyde-shell wbarconfgen.sh n # next waybar mode
bindd = $mainMod Alt, Down, $d previous waybar layout, exec, hyde-shell wbarconfgen.sh p # previous waybar mode
bindd = $mainMod Shift, R, $d wallbash mode selector, exec, pkill -x rofi || hyde-shell wallbashtoggle.sh -m # launch wallbash mode select menu
bindd = $mainMod Shift, T, $d select a theme, exec, pkill -x rofi || hyde-shell themeselect.sh # launch theme select menu
bindd = $mainMod+Shift, Y, $d select animations, exec, pkill -x rofi || hyde-shell animations.sh --select # launch animations select menu
bindd = $mainMod+Shift, I, $d select workflows, exec, pkill -x rofi || hyde-shell workflows.sh --select # launch workflows select menu
bindd = $mainMod+Shift, U, $d select hyprlock layout, exec, pkill -x rofi || hyde-shell hyprlock.sh --select # launch hyprlock layout select menu



$ws=Workspaces
$d=[$ws|Navigation]
bindd = $mainMod, 1, $d navigate to workspace 1, workspace, 1
bindd = $mainMod, 2, $d navigate to workspace 2, workspace, 2
bindd = $mainMod, 3, $d navigate to workspace 3, workspace, 3
bindd = $mainMod, 4, $d navigate to workspace 4, workspace, 4
bindd = $mainMod, 5, $d navigate to workspace 5, workspace, 5
bindd = $mainMod, 6, $d navigate to workspace 6, workspace, 6
bindd = $mainMod, 7, $d navigate to workspace 7, workspace, 7
bindd = $mainMod, 8, $d navigate to workspace 8, workspace, 8
bindd = $mainMod, 9, $d navigate to workspace 9, workspace, 9
bindd = $mainMod, 0, $d navigate to workspace 10, workspace, 10

$d=[$ws|Navigation|Relative workspace]
bindd = $mainMod Ctrl, Right, $d change active workspace forwards, workspace, r+1
bindd = $mainMod Ctrl, Left, $d change active workspace backwards, workspace, r-1

$d=[$ws|Navigation]
bindd = $mainMod Ctrl, Down, $d navigate to the nearest empty workspace, workspace, empty

# Move focused window to a workspace
$d=[$ws|Move window to workspace]
bindd = $mainMod Shift, 1, $d move to workspace 1, movetoworkspace, 1
bindd = $mainMod Shift, 2, $d move to workspace 2, movetoworkspace, 2
bindd = $mainMod Shift, 3, $d move to workspace 3, movetoworkspace, 3
bindd = $mainMod Shift, 4, $d move to workspace 4, movetoworkspace, 4
bindd = $mainMod Shift, 5, $d move to workspace 5, movetoworkspace, 5
bindd = $mainMod Shift, 6, $d move to workspace 6, movetoworkspace, 6
bindd = $mainMod Shift, 7, $d move to workspace 7, movetoworkspace, 7
bindd = $mainMod Shift, 8, $d move to workspace 8, movetoworkspace, 8
bindd = $mainMod Shift, 9, $d move to workspace 9, movetoworkspace, 9
bindd = $mainMod Shift, 0, $d move to workspace 10, movetoworkspace, 10

# Move focused window to a relative workspace
$d=[$ws]
bindd = $mainMod Ctrl+Alt, Right, $d move window to next relative workspace, movetoworkspace, r+1
bindd = $mainMod Ctrl+Alt, Left, $d move window to previous relative workspace, movetoworkspace, r-1


# Scroll through existing workspaces
$d=[$ws|Navigation]
bindd = $mainMod, mouse_down, $d next workspace, workspace, e+1
bindd = $mainMod, mouse_up, $d previous workspace, workspace, e-1


# Move/Switch to special workspace (scratchpad)
$d=[$ws|Navigation|Special workspace]
bindd = $mainMod Shift, S, $d move to scratchpad, movetoworkspace, special
bindd = $mainMod Alt, S, $d move to scratchpad (silent), movetoworkspacesilent, special
bindd = $mainMod, S, $d toggle scratchpad,  togglespecialworkspace

# Move focused window to a workspace silently
$d=[$ws|Navigation|Move window silently]
bindd = $mainMod Alt, 1, $d move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, $d move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, $d move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, $d move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, $d move to workspace 5  (silent), movetoworkspacesilent, 5
bindd = $mainMod Alt, 6, $d move to workspace 6  (silent), movetoworkspacesilent, 6
bindd = $mainMod Alt, 7, $d move to workspace 7  (silent), movetoworkspacesilent, 7
bindd = $mainMod Alt, 8, $d move to workspace 8  (silent), movetoworkspacesilent, 8
bindd = $mainMod Alt, 9, $d move to workspace 9  (silent), movetoworkspacesilent, 9
bindd = $mainMod Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

bindd = $mainMod, D, Toggle DPMS power saving mode, dpms, toggle # Toggle Monitor off and on

