$d=[$wm|Scrolling Keybinds]
bindd = $mainMod Ctrl, h, $d Focus Left Window Column, layoutmsg, move -col
bindd = $mainMod Ctrl, l, $d Focus right Window Column, layoutmsg, move +col
binddel = $mainMod Alt, h, $d Move Window Column to the Left, layoutmsg, swapcol l
binddel = $mainMod Alt, l, $d Move Window Column to the Right, layoutmsg, swapcol r


$d=#! unset the group name
